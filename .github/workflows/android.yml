name: Build APK
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Check UI workflows
        run: |
          npm ci --ignore-scripts
          npm test
      - name: Render UI previews
        run: node tools/render-ui.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: ui-previews
          path: .private/previews/
          include-hidden-files: true
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - name: Restore APK signing key
        env:
          SIGNING_KEY: ${{ secrets.W_AGENT_DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$SIGNING_KEY" ]; then
            mkdir -p "$HOME/.android"
            printf '%s' "$SIGNING_KEY" | base64 --decode > "$HOME/.android/debug.keystore"
          fi
      - name: Install SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Prepare embedded Linux
        run: node tools/prepare-linux.cjs
      - name: Build installable APK
        run: sh gradlew assembleDebug assembleDebugAndroidTest lintDebug testDebugUnitTest --stacktrace
      - name: Name APK
        run: cp app/build/outputs/apk/debug/app-debug.apk W-Agent.apk
      - uses: actions/upload-artifact@v4
        with:
          name: W-Agent-APK
          path: W-Agent.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-reports
          path: app/build/reports/
      - uses: actions/upload-artifact@v4
        with:
          name: android-smoke-apks
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
  android14:
    timeout-minutes: 18
    needs: apk
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: android-smoke-apks
          path: smoke-apks
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: sh tools/android-smoke.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android14-smoke-results
          path: smoke-results/
