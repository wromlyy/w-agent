plugins { id 'com.android.application' }
android {
    namespace 'dev.wagent'
    compileSdk 35
    defaultConfig {
        applicationId 'dev.wagent'
        minSdk 28
        targetSdk 35
        versionCode 3
        versionName '0.3.0'
        testInstrumentationRunner 'dev.wagent.DeviceSmokeInstrumentation'
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    packagingOptions { jniLibs { useLegacyPackaging true; keepDebugSymbols += ["**/libwproot.so", "**/libwloader.so"] } }
    buildTypes { release { minifyEnabled false; debuggable false; signingConfig signingConfigs.debug } }
}
dependencies {
    implementation 'androidx.work:work-runtime:2.10.1'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20250107'
}
